name: PR deployment cleanup

# Removes throwaway pull request environments that a failed or interrupted
# teardown left behind, and purges their soft-deleted Key Vaults. It only
# touches resource groups this repository tagged as throwaway environments;
# see scripts/remove-ci-environments.ps1. Skipped until the AZURE_CLIENT_ID
# repository variable is set. Setup: docs/ci-deployment.md.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      older_than_hours:
        description: Remove environments created more than this many hours ago
        type: number
        default: 6

permissions:
  contents: read

concurrency:
  group: pr-deployment-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sign the Azure CLI in
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove leftover environments
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          OLDER_THAN_HOURS: ${{ inputs.older_than_hours || 6 }}
        run: |
          ./scripts/remove-ci-environments.ps1 -SubscriptionId $env:AZURE_SUBSCRIPTION_ID `
              -Repository $env:GITHUB_REPOSITORY -OlderThanHours ([int] $env:OLDER_THAN_HOURS)
