name: Template initialization

# A repository created from the template inherits the template owner's tenants
# and subscriptions. On that repository's first push, replace them with the
# example values. The job never runs in the template repository itself, and
# never again after the first run, so a repository's own tenants are kept.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  init:
    if: ${{ !github.event.repository.is_template && github.run_number == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the template owner's specifics with examples
        shell: pwsh
        run: ./scripts/init-from-template.ps1

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nothing to replace."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Replace the template owner's tenants with example values"
          git push
