# Lint the workflows and validate the infrastructure on GitHub-hosted runners.
# "CI result" always reports and fails when any job failed: make it the one required check.
# A new job joins the needs of "CI result", never a required check of its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; runs on main are never
# cancelled, so each main commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (and shellcheck on run scripts)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Fictitious values only. The masks are compared, never printed as is: the runner would
      # act on ::add-mask:: lines.
      - name: Mask values action (shellcheck and self-test)
        env:
          MASK_MIN_LENGTH: 4
        run: |
          script=.github/actions/mask-values/mask-values.sh
          shellcheck "$script"
          input='{"alice@contoso.com":{"ids":["00000000-0000-0000-0000-000000000001","dev"]},"rg":"/subscriptions/00000000-0000-0000-0000-000000000002/resourceGroups/rg-50%"}'
          expected=$(cat <<'MASKS'
          ::add-mask::/subscriptions/00000000-0000-0000-0000-000000000002/resourceGroups/rg-50%25
          ::add-mask::00000000-0000-0000-0000-000000000001
          ::add-mask::00000000-0000-0000-0000-000000000002
          ::add-mask::alice@contoso.com
          ::add-mask::{"alice@contoso.com":{"ids":["00000000-0000-0000-0000-000000000001","dev"]},"rg":"/subscriptions/00000000-0000-0000-0000-000000000002/resourceGroups/rg-50%25"}
          MASKS
          )
          actual=$(bash "$script" <<<"$input")
          differences=$(diff <(LC_ALL=C sort <<<"$actual") <(LC_ALL=C sort <<<"$expected") || true)
          if [ -n "$differences" ]; then
            echo "${differences//::add-mask::/add-mask: }"
            echo "::error::mask-values.sh: the masks above differ from the expected ones (< got, > expected)"
            exit 1
          fi

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path . -Recurse -File -Filter *.json |
            ForEach-Object {
              try {
                Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null
              }
              catch {
                throw "Invalid JSON in $($_.FullName): $($_.Exception.Message)"
              }
            }

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts, tests -Recurse -File -Filter *.ps1 |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_ }
                exit 1
              }
            }

      # The catalog index, the generated private DNS zone list and the module
      # tables in docs/modules.md are all derived from
      # infra/modules/*/metadata.json. A stale index means preflight and the
      # DNS module disagree with the modules actually on disk.
      - name: Check generated files are current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-catalog.ps1 -Check
          ./scripts/build-docs.ps1 -Check

      # Covers naming equivalence, name-rule compliance, catalog conformance,
      # Bicep build and lint, the profile matrix and the workflow rules.
      - name: Run the test suite
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Check Bicep formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem infra -Recurse -Filter *.bicep | ForEach-Object {
            # Normalise line endings on both sides: the comparison must fail on
            # formatting, not on the platform the check happens to run on.
            $formatted = ((@(& az bicep format --file $_.FullName --stdout) -join "`n") -replace "`r", '').TrimEnd()
            $current = ((Get-Content -LiteralPath $_.FullName -Raw) -replace "`r", '').TrimEnd()
            if ($formatted -cne $current) {
              throw "$($_.FullName) is not formatted. Run: az bicep format --file $($_.FullName)"
            }
          }

  result:
    name: CI result
    if: always()
    needs: [workflows, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
